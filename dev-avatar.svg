<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Cartoon avatar of a developer with a laptop, surrounded by smaller faces with different expressions">
  <title>Developer avatar</title>
  <style>
    .float  { animation: float 4.5s ease-in-out infinite; }
    .float2 { animation: float 5.5s ease-in-out infinite; animation-delay: -1.5s; }
    .float3 { animation: float 5s ease-in-out infinite; animation-delay: -3s; }
    .blink  { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
    .twinkle  { animation: tw 2.4s ease-in-out infinite; }
    .twinkle2 { animation: tw 3.1s ease-in-out infinite; animation-delay: -1s; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.08); } }
    @keyframes tw { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
  </style>

  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d2745"/>
      <stop offset="1" stop-color="#14111f"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c83f7"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5e7eb"/>
      <stop offset="1" stop-color="#9ca3af"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.58" stop-color="#fff"/>
      <stop offset="0.82" stop-color="#000"/>
    </linearGradient>
    <mask id="fade" maskUnits="userSpaceOnUse" x="-140" y="-110" width="280" height="280">
      <rect x="-140" y="-110" width="280" height="280" fill="url(#fadeg)"/>
    </mask>

    <polygon id="star" points="0,-12 2.94,-4.05 11.41,-3.71 4.76,1.55 7.05,9.71 0,5 -7.05,9.71 -4.76,1.55 -11.41,-3.71 -2.94,-4.05" fill="#fde047" stroke="#f59e0b" stroke-width="1.5" stroke-linejoin="round"/>
    <path id="heart" d="M0 8 C-18 -4 -10 -18 0 -8 C10 -18 18 -4 0 8 Z" fill="#fb7185"/>
    <path id="spark" d="M0 -9 Q1 -1 9 0 Q1 1 0 9 Q-1 1 -9 0 Q-1 -1 0 -9 Z" fill="#22d3ee"/>

    <!-- Head, hair and hoodie (no expression) -->
    <g id="person">
      <path d="M-70 -10 C-78 -85 -40 -92 0 -92 C40 -92 78 -85 70 -10 C76 40 80 80 66 100 L-66 100 C-80 80 -76 40 -70 -10 Z" fill="url(#hair)"/>
      <path d="M-100 150 C-100 100 -70 82 -30 80 L30 80 C70 82 100 100 100 150 Z" fill="url(#hoodie)"/>
      <path d="M-62 20 C-70 60 -72 90 -56 108 C-46 90 -48 50 -50 20 Z" fill="url(#hair)"/>
      <path d="M62 20 C70 60 72 90 56 108 C46 90 48 50 50 20 Z" fill="url(#hair)"/>
      <rect x="-14" y="48" width="28" height="42" rx="10" fill="#e3ae86"/>
      <circle cx="-57" cy="6" r="9" fill="#f3c9a5"/>
      <circle cx="57" cy="6" r="9" fill="#f3c9a5"/>
      <ellipse cx="0" cy="0" rx="56" ry="62" fill="#f3c9a5"/>
      <ellipse cx="-34" cy="22" rx="10" ry="6" fill="#f472b6" opacity="0.35"/>
      <ellipse cx="34" cy="22" rx="10" ry="6" fill="#f472b6" opacity="0.35"/>
      <path d="M-3 12 Q0 18 4 12" stroke="#c98d68" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M-32 -18 Q-22 -24 -12 -19" stroke="#2d2745" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M12 -19 Q22 -24 32 -18" stroke="#2d2745" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M-60 -6 C-66 -70 -30 -80 0 -80 C34 -80 68 -66 60 -6 C48 -34 26 -46 -6 -46 C-30 -46 -50 -34 -60 -6 Z" fill="url(#hair)"/>
      <path d="M-30 -66 Q-10 -76 14 -72" stroke="#5b5380" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
    </g>

    <!-- Expressions for the smaller faces -->
    <g id="ex-star">
      <use href="#star" x="-22" y="-2"/>
      <use href="#star" x="22" y="-2"/>
      <ellipse cx="0" cy="31" rx="10" ry="12" fill="#8a2d3b"/>
      <ellipse cx="0" cy="37" rx="6" ry="4" fill="#f87171"/>
    </g>
    <g id="ex-heart">
      <path d="M-32 -2 Q-22 -12 -12 -2" stroke="#2d2745" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M12 -2 Q22 -12 32 -2" stroke="#2d2745" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M-14 26 Q0 38 14 26" stroke="#8a2d3b" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <use href="#heart" x="54" y="-46"/>
      <use href="#heart" x="-58" y="34" transform="translate(-58 34) scale(0.8) translate(58 -34)"/>
      <use href="#heart" x="52" y="44" transform="translate(52 44) scale(1.1) translate(-52 -44)"/>
    </g>
    <g id="ex-wink">
      <ellipse cx="-22" cy="-2" rx="9" ry="10.5" fill="#fff"/>
      <circle cx="-22" cy="-1" r="6" fill="#4a2f1d"/>
      <circle cx="-20" cy="-4" r="2" fill="#fff"/>
      <path d="M12 0 Q22 -10 32 0" stroke="#2d2745" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M-18 24 Q0 44 18 24 Z" fill="#8a2d3b"/>
      <path d="M-7 33 Q0 48 7 33 Z" fill="#f87171"/>
    </g>
  </defs>

  <!-- background glow -->
  <circle cx="400" cy="175" r="170" fill="url(#glow)"/>

  <!-- sparkles -->
  <use href="#spark" x="300" y="60" class="twinkle"/>
  <use href="#spark" x="505" y="48" class="twinkle2"/>
  <use href="#spark" x="130" y="40" class="twinkle2"/>
  <use href="#spark" x="690" y="70" class="twinkle"/>
  <use href="#spark" x="240" y="330" class="twinkle"/>
  <use href="#spark" x="570" y="335" class="twinkle2"/>

  <!-- far left: wink -->
  <g transform="translate(62 272) scale(0.45)" opacity="0.5">
    <g class="float3"><g mask="url(#fade)"><use href="#person"/><use href="#ex-wink"/></g></g>
  </g>

  <!-- near left: star eyes -->
  <g transform="translate(185 150) scale(0.62)" opacity="0.8">
    <g class="float2"><g mask="url(#fade)"><use href="#person"/><use href="#ex-star"/></g></g>
  </g>

  <!-- near right: hearts -->
  <g transform="translate(615 150) scale(0.62)" opacity="0.8">
    <g class="float"><g mask="url(#fade)"><use href="#person"/><use href="#ex-heart"/></g></g>
  </g>

  <!-- far right: wink, mirrored -->
  <g transform="translate(738 272) scale(-0.45 0.45)" opacity="0.5">
    <g class="float2"><g mask="url(#fade)"><use href="#person"/><use href="#ex-wink"/></g></g>
  </g>

  <!-- shadow under laptop -->
  <ellipse cx="400" cy="376" rx="120" ry="8" fill="#000" opacity="0.16"/>

  <!-- main character -->
  <g transform="translate(400 140)">
    <g class="float3">
      <use href="#person"/>

      <!-- happy face -->
      <g class="blink">
        <ellipse cx="-22" cy="-2" rx="9" ry="10.5" fill="#fff"/>
        <circle cx="-22" cy="-1" r="6" fill="#4a2f1d"/>
        <circle cx="-20" cy="-4" r="2" fill="#fff"/>
        <ellipse cx="22" cy="-2" rx="9" ry="10.5" fill="#fff"/>
        <circle cx="22" cy="-1" r="6" fill="#4a2f1d"/>
        <circle cx="24" cy="-4" r="2" fill="#fff"/>
      </g>
      <path d="M-20 24 Q0 48 20 24 Z" fill="#8a2d3b"/>
      <path d="M-18 25 L18 25 Q0 33 -18 25 Z" fill="#fff"/>

      <!-- peace-sign hand -->
      <g stroke="#d9a27a" stroke-width="1.5" fill="#f3c9a5">
        <rect x="90" y="18" width="13" height="54" rx="6.5" transform="rotate(-14 96 72)"/>
        <rect x="107" y="22" width="13" height="52" rx="6.5" transform="rotate(10 113 74)"/>
        <ellipse cx="100" cy="78" rx="23" ry="26"/>
        <ellipse cx="76" cy="90" rx="8" ry="14" transform="rotate(35 76 90)"/>
      </g>
      <path d="M86 92 Q100 100 114 92" stroke="#d9a27a" stroke-width="2" fill="none" stroke-linecap="round"/>

      <!-- laptop -->
      <rect x="-108" y="84" width="216" height="128" rx="10" fill="url(#lid)" stroke="#8b929e" stroke-width="2"/>
      <path d="M-98 92 H60 L40 204 H-98 Z" fill="#fff" opacity="0.12"/>
      <path d="M-12 136 L-30 148 L-12 160" stroke="#4f46e5" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12 136 L30 148 L12 160" stroke="#4f46e5" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M5 130 L-5 166" stroke="#0891b2" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M-124 212 H124 L116 222 Q0 228 -116 222 Z" fill="#aeb4bf"/>
    </g>
  </g>
</svg>
